name: Interpreter correctness and performance evidence

on:
  push:
    branches: [main, perf/interpreter-20261017]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZR_VM_TEST_TIER: core
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure ASan, UBSan and forced full GC
        run: >-
          cmake -S . -B build-gc-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -DZR_DEBUG_GARBAGE_COLLECT_MEM_TEST"
          -DBUILD_LANGUAGE_SERVER=OFF -DBUILD_LANGUAGE_SERVER_EXTENSION=OFF
          -DBUILD_RUST_BINDING=OFF -DBUILD_TESTS=ON
      - name: Build all registered test dependencies
        run: cmake --build build-gc-sanitizers --parallel 2
      - name: Run standalone GC suite
        run: build-gc-sanitizers/bin/zr_vm_gc_test
      - name: Test GC and interpreter boundaries
        run: >-
          ctest --test-dir build-gc-sanitizers --no-tests=error --output-on-failure
          -R 'interpreter_gc|gc|execution_budget|execution_integer_boundaries|typed_opcode|container'
      - name: Run allocation and interpreter smoke probes
        run: >-
          python3 tests/benchmarks/run_interpreter_probes.py
          --cli build-gc-sanitizers/bin/zr_vm_cli
          --work-dir build-gc-sanitizers/probe-results --smoke --repeat 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interpreter-gc-sanitizers
          path: |
            build-gc-sanitizers/Testing/Temporary/LastTest.log
            build-gc-sanitizers/probe-results/results.json
          if-no-files-found: ignore

  # Demo evidence stays independent of the interpreter correctness gates.
  demo:
    name: Swarm demo (${{ matrix.configuration }}, non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: release
            build-type: Release
            rust-binding: "ON"
            c-flags: ""
          - configuration: asan
            build-type: Debug
            rust-binding: "OFF"
            c-flags: -fsanitize=address,undefined -fno-omit-frame-pointer
    env:
      DEMO_BUILD_DIR: build-demo-${{ matrix.configuration }}
      TMPDIR: ${{ github.workspace }}/build-demo-${{ matrix.configuration }}/tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Select memory-aware build parallelism
        run: |
          mkdir -p "$TMPDIR"
          jobs=$(awk '/MemAvailable/ {print ($2 < 6291456 ? 1 : 2)}' /proc/meminfo)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"
      - name: Configure Swarm demo
        env:
          DEMO_C_FLAGS: ${{ matrix.c-flags }}
        run: >-
          cmake -S . -B "$DEMO_BUILD_DIR" -G Ninja
          -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_C_FLAGS="$DEMO_C_FLAGS"
          -DZR_VM_BUILD_DEMOS=ON -DBUILD_TESTS=ON -DBUILD_CLI=ON
          -DBUILD_NETWORK_LIB=ON -DBUILD_RUST_BINDING=${{ matrix.rust-binding }}
          -DBUILD_LANGUAGE_SERVER=OFF -DBUILD_LANGUAGE_SERVER_EXTENSION=OFF
      - name: Build demo smoke dependencies
        id: build
        run: >-
          cmake --build "$DEMO_BUILD_DIR"
          --target zr_vm_cli_executable zr_swarm zrgame_plugins zrgame_ffi zrgame_native_tests
      - name: Run Release smoke and selected demo CTests
        if: matrix.configuration == 'release'
        run: >-
          ctest --test-dir "$DEMO_BUILD_DIR" -j1 --no-tests=error --output-on-failure
          -L '^demo$'
          -R '^(demo_native_runtime|demo_native_smoke_(interp|binary)|demo_cli_smoke_(interp|binary)_dod|demo_host_smoke_(dod|c)|demo_cli_host_parity|demo_lane_equivalence|demo_session_(smoke|budget))$'
      - name: Record W10 perf matrix (report only)
        if: ${{ !cancelled() && matrix.configuration == 'release' && steps.build.outcome == 'success' }}
        run: >-
          python3 -I demos/swarm_arena/tools/run_w10.py
          --cli "$DEMO_BUILD_DIR/bin/zr_vm_cli"
          --native-dir "$DEMO_BUILD_DIR/demos/swarm_arena/native"
          --mode interp --calls 2000 --warmup 120 --repetitions 1
          --out "$DEMO_BUILD_DIR/perf-matrix"
      - name: Run ASan and UBSan demo smoke
        if: matrix.configuration == 'asan'
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          ctest --test-dir "$DEMO_BUILD_DIR" -j1 --no-tests=error --output-on-failure
          -L '^demo$'
          -R '^(demo_native_runtime|demo_native_smoke_(interp|binary)|demo_cli_smoke_(interp|binary)_dod|demo_host_smoke_(dod|c))$'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.configuration == 'release' }}
        with:
          name: swarm-demo-perf-matrix
          path: |
            build-demo-release/perf-matrix/result.json
            build-demo-release/perf-matrix/w10.md
            build-demo-release/perf-matrix/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-demo-${{ matrix.configuration }}
          path: |
            build-demo-${{ matrix.configuration }}/Testing/Temporary/LastTest.log
            build-demo-${{ matrix.configuration }}/Testing/Temporary/LastTestsFailed.log
            build-demo-${{ matrix.configuration }}/tmp/**/result.json
            build-demo-${{ matrix.configuration }}/tmp/**/*.log
            build-demo-${{ matrix.configuration }}/tmp/**/summary.json
          if-no-files-found: ignore

  performance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure Release probes
        run: >-
          cmake -S . -B build-interpreter-perf -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_LANGUAGE_SERVER=OFF -DBUILD_LANGUAGE_SERVER_EXTENSION=OFF
          -DBUILD_RUST_BINDING=OFF -DBUILD_TESTS=ON
      - name: Build probe runners
        run: cmake --build build-interpreter-perf --target zr_vm_cli zr_vm_budgeted_loop --parallel 2
      - name: Run interpreter smoke probes
        run: >-
          python3 tests/benchmarks/run_interpreter_probes.py
          --cli build-interpreter-perf/bin/zr_vm_cli
          --work-dir build-interpreter-perf/smoke-results --smoke --repeat 1
      - name: Check depth scaling at full allocation count
        run: >-
          python3 tests/benchmarks/run_interpreter_probes.py
          --cli build-interpreter-perf/bin/zr_vm_cli
          --work-dir build-interpreter-perf/deep-results
          --cases deep_alloc0,deep_alloc --repeat 3 --check-deep-ratio
      - name: Record budget overhead
        run: |
          build-interpreter-perf/bin/zr_vm_budgeted_loop > build-interpreter-perf/budget-intloop.json
          build-interpreter-perf/bin/zr_vm_budgeted_loop --source tests/benchmarks/probes/interpreter/calls.zr --expected 3000000 > build-interpreter-perf/budget-calls.json
          build-interpreter-perf/bin/zr_vm_budgeted_loop --source tests/benchmarks/probes/interpreter/fib.zr --expected 196418 > build-interpreter-perf/budget-fib.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interpreter-performance-evidence
          path: |
            build-interpreter-perf/smoke-results/results.json
            build-interpreter-perf/deep-results/results.json
            build-interpreter-perf/budget-*.json
          if-no-files-found: ignore
