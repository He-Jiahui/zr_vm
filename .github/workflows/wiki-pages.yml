# @unit GHWF-015 build documentation toolchain
#
# ## Summary
# 选择Python3.x并安装固定Zensical版本及本地Pygments entry point供测试和站点渲染使用。
#
# ## Configuration inputs
# actions/setup-python@v6 的3.x，pip -r requirements-docs.txt；本地docs/pygments_zr的pyproject元数据。
#
# ## Outputs
# 安装zensical0.0.59与本地zr-vm-pygments，后者注册pygments.lexers的zr入口；不是生成或编译ZR源码。
#
# ## Constraints and lifecycle
# 本地插件声明Python>=3.9而theme测试实际import tomllib，实际运行环境需满足测试依赖。Pygments>=2.17和setuptools>=61为下界，不能称完整可复现锁；安装可能访问网络及写工具/缓存。
# 环境或安装错误阻断测试与strict site；未设置忽略依赖失败。
#
# ## References
# - requirements-docs.txt:1
# - requirements-docs.txt:2
# - docs/pygments_zr/pyproject.toml:2
# - docs/pygments_zr/pyproject.toml:10
# - docs/pygments_zr/pyproject.toml:13
# - tests/scripts/test_wiki_theme_assets.py:6
# - .github/workflows/wiki-pages.yml:64
# - .github/workflows/wiki-pages.yml:72

# @unit GHWF-017 build lexer registration probe
#
# ## Summary
# 在安装后的Python环境按zr别名取Pygments lexer并检查返回对象的aliases，再打印名称。
#
# ## Configuration inputs
# 内嵌python -c模块块，get_lexer_by_name('zr') 与lexer.aliases；不是函数或lambda定义。
#
# ## Outputs
# 检查成功时打印lexer.name，失败由Python异常/原assert反映；本地插件声明提供entry point。
#
# ## Constraints and lifecycle
# 探针只核注册可取和zr别名，不证明lexer来源唯一、全部token规则正确或ZR编译执行。原assert语义受实际Python启动模式约束，工作流未设置优化开关。
# 插件查找或断言失败使此步骤失败；不能因安装命令成功就省略注册验证。
#
# ## References
# - docs/pygments_zr/pyproject.toml:13
# - tests/scripts/test_zr_pygments.py:21
# - .github/workflows/wiki-pages.yml:60
# - .github/workflows/wiki-pages.yml:64

# @unit GHWF-019 build strict site and rendered HTML gates
#
# ## Summary
# 先清除checkout内旧site，再strict构建，依次要求非空index、cookbook着色标记和站点入口校验。
#
# ## Configuration inputs
# 显式bash set -euo pipefail；site固定目录、zensical build --clean --strict、两段现有验证命令。
#
# ## Outputs
# site/index.html必须非空；UTF8读取site/02-language/cookbook/index.html并检查language-zr及k/kn class片段；最后validator --site-dir site统计并检查入口。
#
# ## Constraints and lifecycle
# rm -rf site 只处理此 runner checkout 的相对目录。HTML 一行 Python 是模块块而非函数；字符串探针仅覆盖一页着色标记，不保证全 HTML 结构、安全或所有页面。validator 的 site-dir 只核目录、index 与文件计数，不能替代 Zensical 构建退出状态。
# 严格bash按原命令退出状态停止；删目录后后续失败可能留下部分site，无回滚或finally清理；上传仍要求前序成功。
#
# ## References
# - .github/workflows/wiki-pages.yml:70
# - .github/workflows/wiki-pages.yml:71
# - .github/workflows/wiki-pages.yml:72
# - .github/workflows/wiki-pages.yml:73
# - .github/workflows/wiki-pages.yml:74
# - .github/workflows/wiki-pages.yml:75
# - scripts/validate_wiki.py:339
# - scripts/validate_wiki.py:343
# - scripts/validate_wiki.py:344

# @unit GHWF-020 build main Pages artifact upload
#
# ## Summary
# 仅在main push或main手动dispatch的成功build中上传site作为Pages部署输入。
#
# ## Configuration inputs
# 与deploy一致的事件+ref条件，actions/upload-pages-artifact@v5，path=site。
#
# ## Outputs
# 外部Pages artifact供后续needs:build的deploy消费；不是把site写回源码仓库。
#
# ## Constraints and lifecycle
# PR 及非 main dispatch 不上传；本配置不声明自定保留期限或完整内容身份。上传动作及平台存储由外部 Actions 实现。
# 上传失败使build不能作为正常成功输入交付deploy；该步骤不会修复前面的partial site。
#
# ## References
