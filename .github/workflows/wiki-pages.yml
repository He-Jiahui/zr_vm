name: Wiki Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wiki-pages.yml"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "scripts/validate_wiki.py"
      - "tests/scripts/test_validate_wiki.py"
      - "tests/scripts/test_wiki_theme_assets.py"
      - "tests/scripts/test_zr_pygments.py"
      - "docs/pygments_zr/**"
      - "docs/wiki/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/wiki-pages.yml"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "scripts/validate_wiki.py"
      - "tests/scripts/test_validate_wiki.py"
      - "tests/scripts/test_wiki_theme_assets.py"
      - "tests/scripts/test_zr_pygments.py"
      - "docs/pygments_zr/**"
      - "docs/wiki/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install documentation toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Run wiki contract tests
        run: python -m unittest tests/scripts/test_validate_wiki.py tests/scripts/test_wiki_theme_assets.py tests/scripts/test_zr_pygments.py -v
      - name: Verify ZR lexer registration
        run: python -c "from pygments.lexers import get_lexer_by_name; lexer = get_lexer_by_name('zr'); assert 'zr' in lexer.aliases; print(lexer.name)"
      - name: Validate wiki source
        run: python scripts/validate_wiki.py --root .
      - name: Build strict site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          zensical build --clean --strict
          test -s site/index.html
          python -c "from pathlib import Path; html = Path('site/02-language/cookbook/index.html').read_text(encoding='utf-8'); assert 'language-zr' in html; assert 'class=\"k\"' in html or 'class=\"kn\"' in html"
          python scripts/validate_wiki.py --root . --site-dir site
      - name: Upload Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy wiki
    # PR 只验证源码和产物；main 的 push 或手动触发才发布 Pages。
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

# @unit GHWF-011 permissions and concurrency
#
# ## Summary
# 分离只读Wiki构建和Pages发布权限，并按共享github-pages并发组限制发布流水线冲突。
#
# ## Configuration inputs
# 全局contents:read；build另声明pages:read；deploy有pages:write与id-token:write；concurrency.group=github-pages。
#
# ## Outputs
# job令牌和environment受各自配置限制，deploy URL取deployment输出；cancel-in-progress=false不主动取消已经运行的同组执行。
#
# ## Constraints and lifecycle
# 不是仓库所有workflow的全局锁，不承诺pending请求FIFO或全部保留；外部Actions/仓库Pages与environment设置仍是前提。权限配置不证明实际token或发布成功。
# 权限不足、环境保护或外部动作失败仍可阻止构建/发布；此文件没有源码回滚或重试逻辑。
#
# ## References
# - .github/workflows/wiki-pages.yml:36
# - .github/workflows/wiki-pages.yml:37
# - .github/workflows/wiki-pages.yml:46
# - .github/workflows/wiki-pages.yml:91
# - .github/workflows/wiki-pages.yml:92
# - .github/workflows/wiki-pages.yml:95

# @unit GHWF-012 build
#
# ## Summary
# 以受限Ubuntu job安装docs工具、测试源码合同、校验Wiki并严格生成站点，按事件门禁交付Pages artifact。
#
# ## Configuration inputs
# checkout（fetch-depth0）、Python3.x、requirements-docs.txt、本地Pygments包、docs/wiki及根项目配置。
#
# ## Outputs
# 前置全部成功后产生site/并按main条件上传；build状态是deploy的needs输入。
#
# ## Constraints and lifecycle
# job timeout10分钟；外部action主版本/Python3.x和依赖下界不是全工具链锁。源校验与HTML探针各有有限范围，不是语言编译或所有HTML正确性证明。
# 无continue-on-error；任一依赖安装、unittest、assert、CLI或strict构建失败均阻断正常上传与依赖它的deploy。
#
# ## References
# - requirements-docs.txt:1
# - requirements-docs.txt:2
# - .github/workflows/wiki-pages.yml:43
# - .github/workflows/wiki-pages.yml:62
# - .github/workflows/wiki-pages.yml:72
# - .github/workflows/wiki-pages.yml:75
# - .github/workflows/wiki-pages.yml:77
# - .github/workflows/wiki-pages.yml:86

# @unit GHWF-013 deploy
#
# ## Summary
# 在build成功并交付对应Pages artifact后，用专用发布权限调用deploy-pages。
#
# ## Configuration inputs
# main push或main dispatch条件、needs:build、github-pages environment、actions/deploy-pages@v5。
#
# ## Outputs
# 外部部署动作交付page_url供environment URL显示；配置不等价实际Pages发布成功。
#
# ## Constraints and lifecycle
# PR和非main dispatch不执行此job；timeout10分钟。没有源码修改、发布失败回滚或站点内容人工替换逻辑；artifact来自前置build，不能把生成站点当手写源码。
# 前置失败、artifact缺失、权限或environment门禁失败不由本job吞掉；外部部署结果只由实际运行证据确认。
#
# ## References
# - .github/workflows/wiki-pages.yml:77
# - .github/workflows/wiki-pages.yml:78
# - .github/workflows/wiki-pages.yml:80
# - .github/workflows/wiki-pages.yml:85
# - .github/workflows/wiki-pages.yml:86
# - .github/workflows/wiki-pages.yml:91
# - .github/workflows/wiki-pages.yml:92
# - .github/workflows/wiki-pages.yml:95
