# main 的 push 与面向 main 的 PR 都运行同一构建/CTest 矩阵，防止平台差异只在发布后暴露。
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # 保留所有平台结果；一个组合失败时继续收集其余组合的构建和测试证据。
      fail-fast: false

      # Ubuntu validates optimized Release builds with both supported toolchains.
      # Windows validates the full Debug build and test suite. The current Release
      # build is blocked by MSVC optimizing execution_dispatch.c for over 40 minutes.
      matrix:
        include:
          - os: windows-latest
            build_type: Debug
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Set up MSVC developer command prompt
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set reusable strings
      # Windows 将输出移到短路径，避免长测试目标的 MSVC 对象文件路径超限；后续三个步骤共用该目录。
      id: strings
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # Long test target names exceed MSVC's object-path limit below the workspace directory.
          echo "build-output-dir=D:/b" >> "$GITHUB_OUTPUT"
        else
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -A x64
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_C_FLAGS=/MP
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Unix)
      if: runner.os != 'Windows'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build (Windows)
      if: runner.os == 'Windows'
      # Let MSVC parallelize source files while limiting concurrent project builds.
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 2

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # CTest 消费当前配置注册的测试；Windows Visual Studio 是多配置生成器，必须传 --build-config。
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
