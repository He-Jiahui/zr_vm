[project]
site_name = "ZrVm Wiki"
site_description = "ZrVm language, compiler, VM runtime, standard library, and C API reference"
site_author = "ZrVm contributors"
site_url = "https://he-jiahui.github.io/zr_vm/"
repo_url = "https://github.com/He-Jiahui/zr_vm"
repo_name = "He-Jiahui/zr_vm"
edit_uri = "edit/main/docs/wiki/"
docs_dir = "docs/wiki"
site_dir = "site"
use_directory_urls = true
strict = true
extra_css = [
  "stylesheets/extra.css",
]

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.expand",
  "navigation.path",
  "navigation.tracking",
  "navigation.indexes",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.select",
  "content.code.annotate",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "使用系统主题"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色模式"

[project.markdown_extensions]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

[project.validation]
invalid_links = true
invalid_link_anchors = true
